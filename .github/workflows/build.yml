name: Build
run-name: Build${{ inputs.line && format(' line {0}', inputs.line) || '' }} # the doctor tells lines apart by this

# Event-driven: Gate, Choose, Judge, Plan and Queue dispatch this whenever the loop may have work
# (a decision was made, a PR merged/closed, a check failed, new issues planned). It develops only when
# no autopilot PR is awaiting checks or review; otherwise it exits in seconds.
on:
  workflow_dispatch:
    inputs:
      line:
        description: Lines mode only, the line to advance (a, b or c)
        required: false
        default: ''
  issues:
    types: [labeled] # a human marks an issue `ready`
  schedule:
    - cron: "41 * * * *" # recovery heartbeat only: resumes after an outage or a failed round; no-op when busy or waiting

concurrency:
  group: autopilot-build-${{ inputs.line || 'main' }} # each line runs independently; the main loop runs alone

# Three jobs per variant, so the agents' runner never holds a write token (docs/AUTOPILOT.md → Security): prepare (no
# agents) reads GitHub, starts a line's branch and hands over a ready workspace; variant runs the agents with
# `contents: read` only and hands back a git bundle plus .autopilot/ results; publish, on a fresh runner, runs only
# main's copy of the loop, verifies the hand-off (scripts/handoff.ts), then pushes and opens the PR with GITHUB_TOKEN.
permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write
  checks: read
  statuses: read

jobs:
  pick:
    if: vars.AUTOPILOT == 'on' && (github.event_name != 'issues' || github.event.label.name == 'ready')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.next.outputs.mode }}
      number: ${{ steps.next.outputs.number }}
      variants: ${{ steps.next.outputs.variants }}
      attempt: ${{ steps.next.outputs.attempt }}
      base: ${{ steps.base.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main # newest main, not the commit that queued this run
      - id: base # every variant starts from this exact commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - id: next
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_ATTEMPTS: ${{ vars.MAX_ATTEMPTS || '10' }}
          DAILY_PR_CAP: ${{ vars.DAILY_PR_CAP || '0' }} # 0 = no cap
          LINE_MAX_ATTEMPTS: ${{ vars.LINE_MAX_ATTEMPTS || '10' }}
          STALL_MINUTES: ${{ vars.STALL_MINUTES || '45' }}
          AUTOPILOT_MODE: ${{ vars.AUTOPILOT_MODE }}
          LIMIT_COOLDOWN_HOURS: ${{ vars.LIMIT_COOLDOWN_HOURS || '5' }}
          LINE: ${{ inputs.line }}
        run: node scripts/autopilot.ts next
      - name: Nothing to build, so plan more work
        if: steps.next.outputs.plan == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run plan.yml -R "$GITHUB_REPOSITORY"

  # No agents here. Reads the task from GitHub, and on a line's first round pushes the line's branch (so this job holds
  # contents: write), running only main's scripts (loop/); packs the workspace and main's loop for the agents' job.
  prepare:
    needs: pick
    if: needs.pick.outputs.mode == 'build' || needs.pick.outputs.mode == 'fix'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
      issues: read
      checks: read
      statuses: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.pick.outputs.variants) }}
    name: prepare ${{ matrix.variant.key || needs.pick.outputs.mode }}
    outputs:
      line_base: ${{ steps.prep.outputs.base_sha }} # read only for a line's round, which is a single leg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.pick.outputs.base }}
          path: loop # the scripts this job runs, and the agents' team specs: main's, never a line's own copy
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.pick.outputs.base }}
          path: work
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Prepare branch and task
        id: prep
        working-directory: work
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ needs.pick.outputs.mode }}
          NUMBER: ${{ needs.pick.outputs.number }}
          VARIANT: ${{ toJSON(matrix.variant) }}
          BASE: ${{ needs.pick.outputs.base }}
        run: |
          git config user.name "stock-social-autopilot"
          git config user.email "autopilot@users.noreply.github.com"
          node "$GITHUB_WORKSPACE/loop/scripts/autopilot.ts" prepare
      - name: Pack the prepared workspace and main's loop
        working-directory: work
        env:
          BRANCH: ${{ steps.prep.outputs.branch }}
          BASE_SHA: ${{ steps.prep.outputs.base_sha }}
          BASE_REF: ${{ steps.prep.outputs.base }}
          PLANNED: ${{ steps.prep.outputs.planned }}
        run: |
          node "$GITHUB_WORKSPACE/loop/scripts/handoff.ts" prep
          tar -czf "$RUNNER_TEMP/workspace.tgz" .
          tar -czf "$RUNNER_TEMP/loop.tgz" -C "$GITHUB_WORKSPACE/loop" scripts team
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prep-${{ matrix.variant.key || 'single' }}
          path: |
            ${{ runner.temp }}/workspace.tgz
            ${{ runner.temp }}/loop.tgz
          if-no-files-found: error
          retention-days: 1

  # One branch team per variant (A/B/C), in parallel, each on its own branch and PR:
  # designer ⇄ business analyst → spec → engineer ⇄ tester (scripts/team.ts; role specs in team/).
  # Fix mode and `single` issues run one entry. Every tool and root on this throwaway runner, so it holds no write
  # token: `contents: read` and no GitHub token in any step. It hands back a bundle of its branch as an artifact.
  variant:
    needs: [pick, prepare]
    if: ${{ !cancelled() && (needs.pick.outputs.mode == 'build' || needs.pick.outputs.mode == 'fix') }}
    runs-on: ubuntu-latest
    timeout-minutes: 350 # GitHub's limit is 360; team.ts stops starting calls at TEAM_MINUTES so it still publishes
    permissions:
      contents: read
    services:
      postgres: # lets the team run the same build and e2e checks as CI
        image: postgres:17
        env:
          POSTGRES_USER: stock_social
          POSTGRES_PASSWORD: stock_social
          POSTGRES_DB: stock_social
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://stock_social:stock_social@localhost:5432/stock_social
      APP_SECRET_KEY: ci-only
      CRON_SECRET: ci-only
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.pick.outputs.variants) }}
    name: variant ${{ matrix.variant.key || needs.pick.outputs.mode }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: prep-${{ matrix.variant.key || 'single' }}
          path: ${{ runner.temp }}/prep
      - name: Restore the prepared workspace and main's loop # a line branch carries its own (possibly older) loop; always run main's
        id: prep
        run: |
          tar -xzf "$RUNNER_TEMP/prep/workspace.tgz" -C "$GITHUB_WORKSPACE"
          mkdir -p "$RUNNER_TEMP/loop" && tar -xzf "$RUNNER_TEMP/prep/loop.tgz" -C "$RUNNER_TEMP/loop"
          echo "LOOP_DIR=$RUNNER_TEMP/loop" >> "$GITHUB_ENV"
          node -e 'const p = require("./.autopilot/prep.json"); console.log("branch=" + p.branch + "\nbase_sha=" + p.base + "\nbase=" + p.baseRef + "\nplanned=" + p.planned)' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Claude Code and a test browser
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          npx playwright install --with-deps chromium
      - name: Plan this line's round (business lead ⇄ engineer)
        if: needs.pick.outputs.mode == 'build' && inputs.line != '' && steps.prep.outputs.planned != 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Scrub Anthropic/GitHub/cloud secrets from the environment of commands the agent runs (Bash(node:*),
          # Bash(npm:*), package install scripts), so an injected prompt can't exfiltrate the token. Set the
          # repo variable to 0 only to debug. With it on, the CLI pins permission mode to the explicit allowlist.
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: ${{ vars.CLAUDE_CODE_SUBPROCESS_ENV_SCRUB || '1' }}
          LINE: ${{ inputs.line }}
          PLAN_ROUNDS: ${{ vars.PLAN_ROUNDS || '4' }}
          PLAN_BUDGET_USD: ${{ vars.PLAN_BUDGET_USD || '6' }}
          MODEL_ENGINEER: ${{ vars.MODEL_ENGINEER }}
        run: node "$LOOP_DIR/scripts/plan.ts"
      - name: Branch team
        id: team
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Scrub Anthropic/GitHub/cloud secrets from the environment of commands the agent runs (the engineer
          # has Bash(node:*)/Bash(npm:*), which could otherwise print the token or leak it via an install script).
          # Set the repo variable to 0 only to debug. With it on, the CLI pins permission mode to the explicit allowlist.
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: ${{ vars.CLAUDE_CODE_SUBPROCESS_ENV_SCRUB || '1' }}
          MODE: ${{ needs.pick.outputs.mode }}
          NUMBER: ${{ needs.pick.outputs.number }}
          BRANCH: ${{ steps.prep.outputs.branch }}
          BASE_REF: ${{ steps.prep.outputs.base }}
          VARIANT: ${{ toJSON(matrix.variant) }}
          SPEC_ROUNDS: ${{ vars.SPEC_ROUNDS || '2' }}
          QA_ROUNDS: ${{ vars.QA_ROUNDS || '40' }}
          TEAM_BUDGET_USD: ${{ vars.TEAM_BUDGET_USD || '100' }} # attempt 1; later attempts get more (team.ts budgetScale, up to 4×)
          ATTEMPT: ${{ needs.pick.outputs.attempt || '1' }}
          ESCALATE_AFTER: ${{ vars.ESCALATE_AFTER || '3' }}
          MODEL_ESCALATE: ${{ vars.MODEL_ESCALATE }}
          MODEL_ENGINEER: ${{ vars.MODEL_ENGINEER }}
        run: node "$LOOP_DIR/scripts/team.ts"
      - name: Hand off to Publish
        id: handoff
        if: steps.team.outcome == 'success'
        env:
          BASE_SHA: ${{ steps.prep.outputs.base_sha }}
          KEY: ${{ matrix.variant.key || 'single' }}
        run: |
          # A random artifact name, drawn now, after the agents: another leg can't take it first and knock this one
          # out. Publish reads it, and the artifact's ID, from this job's log.
          echo "name=agent-$KEY-$(openssl rand -hex 16)" >> "$GITHUB_OUTPUT"
          # Commit what is left, then bundle only the commits since the base. No commits: no bundle, Publish reports it.
          mkdir -p "$RUNNER_TEMP/handoff"
          if [ -n "$(git status --porcelain)" ] || git rev-parse -q --verify MERGE_HEAD >/dev/null; then git add -A && git commit -q --no-verify -m "Work left uncommitted at the end of the run"; fi
          if [ "$(git rev-list --count "$BASE_SHA..HEAD")" != "0" ]; then git bundle create "$RUNNER_TEMP/handoff/branch.bundle" HEAD "^$BASE_SHA"; fi
          for f in result.json handoff.md plan.json; do if [ -f ".autopilot/$f" ]; then cp ".autopilot/$f" "$RUNNER_TEMP/handoff/"; fi; done
      - name: Upload the hand-off
        if: steps.team.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.handoff.outputs.name }}
          path: ${{ runner.temp }}/handoff/
          if-no-files-found: error
          retention-days: 1

  # A fresh runner. It runs only main's copy of the loop (loop/), never anything from the agents' job or $LOOP_DIR, and
  # pushes only what scripts/handoff.ts verified: built on the trusted base, no protected path, sizes capped, text defanged.
  publish:
    needs: [pick, prepare, variant]
    if: ${{ !cancelled() && (needs.pick.outputs.mode == 'build' || needs.pick.outputs.mode == 'fix') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write # dispatch CI on the pushed branch; read the legs' jobs and logs
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.pick.outputs.variants) }}
    name: publish ${{ matrix.variant.key || needs.pick.outputs.mode }}
    env:
      MODE: ${{ needs.pick.outputs.mode }}
      NUMBER: ${{ needs.pick.outputs.number }}
      VARIANT: ${{ toJSON(matrix.variant) }}
      GH_REPO: ${{ github.repository }}
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: loop
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Find this leg's hand-off # the artifact ID upload-artifact logged in this leg's own job, never just a name
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_NAME: variant ${{ matrix.variant.key || needs.pick.outputs.mode }}
          ARTIFACT_PREFIX: agent-${{ matrix.variant.key || 'single' }}-
        run: node "$GITHUB_WORKSPACE/loop/scripts/handoff.ts" artifact
      - name: Download the agents' hand-off
        id: download
        if: steps.artifact.outputs.id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.artifact.outputs.id }}
          merge-multiple: true # the files directly in path, not in a folder named after the artifact
          path: ${{ runner.temp }}/handoff
      - name: Verify the hand-off
        id: verify
        if: steps.download.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_DIR: ${{ runner.temp }}/handoff
          GIT_CONFIG_GLOBAL: /dev/null # never the runner image's git config (lfs filters, credential helpers)
          GIT_CONFIG_NOSYSTEM: '1'
          # A build's base: main at pick; a line's round: the line commit prepare (no agents) recorded after its sync.
          BASE_SHA: ${{ needs.pick.outputs.mode == 'build' && (matrix.variant.base && needs.prepare.outputs.line_base || needs.pick.outputs.base) || '' }}
          PR_NUMBER: ${{ needs.pick.outputs.mode == 'fix' && needs.pick.outputs.number || '' }}
        run: |
          git init -q "$GITHUB_WORKSPACE/work" && cd "$GITHUB_WORKSPACE/work"
          git config user.name "stock-social-autopilot"
          git config user.email "autopilot@users.noreply.github.com"
          node "$GITHUB_WORKSPACE/loop/scripts/handoff.ts" verify
      - name: Publish
        id: publish
        if: steps.verify.outcome == 'success'
        working-directory: work
        env:
          AUTOPILOT_MODE: ${{ vars.AUTOPILOT_MODE }}
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.verify.outputs.branch }}
          GIT_CONFIG_GLOBAL: /dev/null # defense in depth: this repository was made here, from verified objects only
          GIT_CONFIG_NOSYSTEM: '1'
        run: |
          # Keep only the keys this job set (user, origin): nothing else can redirect or run during the push below.
          git config --local --unset-all core.hooksPath || true
          git config --local --name-only --list | sort -u | { grep -viE '^(core\.(repositoryformatversion|filemode|bare|logallrefupdates)|user\.(name|email)|remote\.origin\.(url|fetch)|branch\..+\.(remote|merge))$' || true; } | while read -r k; do git config --local --unset-all "$k"; done
          git config --local remote.origin.url "https://github.com/$GITHUB_REPOSITORY"
          rm -rf .git/hooks .git/config.worktree
          node "$GITHUB_WORKSPACE/loop/scripts/autopilot.ts" publish
      - name: Retry a line's fix right away if this run crashed # attempts are counted, so this is bounded
        if: "!cancelled() && (needs.prepare.result == 'failure' || needs.variant.result == 'failure' || steps.verify.outcome == 'failure' || steps.publish.outcome == 'failure') && inputs.line != '' && needs.pick.outputs.mode == 'fix'"
        env:
          GH_TOKEN: ${{ github.token }}
          LINE: ${{ inputs.line }} # via env, never interpolated into the shell
        run: gh workflow run build.yml -R "$GITHUB_REPOSITORY" -f line="$LINE"
