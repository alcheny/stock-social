name: Features

# Feature pipeline (docs/FEATURES.md): builds the features the owner decided in design sessions, several at a time
# (FEATURE_PARALLEL, default 3), until each is accepted. Separate from the autopilot (own switch FEATURES, own label
# `feature`, own queue in docs/features/). Started from the chat, again by the Gate after each feature PR merges, is
# updated or fails, and by an hourly heartbeat that resumes it after a lost event.
run-name: Features
on:
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *" # recovery heartbeat only: the pick is a no-op when nothing needs doing

# One round at a time: the pick plans the whole round (so two legs never take the same feature), then each task runs
# as its own matrix leg. A run started while a round is going waits and plans the next round.
concurrency:
  group: features

# Three jobs per task, so the agents' runner never holds a write token (docs/FEATURES.md → "Permissions and the failure
# budget"; docs/AUTOPILOT.md → Security). prepare (no agents) reads GitHub and hands the agents a ready workspace;
# build runs the agents with `contents: read` only and hands back a git bundle plus .autopilot/ results; publish, on a
# fresh runner, runs only main's copy of the loop, verifies the hand-off (scripts/handoff.ts) and then pushes and opens
# the PR with GITHUB_TOKEN. The Gate decides what merges.
permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  checks: read
  statuses: read

jobs:
  pick:
    if: vars.FEATURES == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tasks: ${{ steps.next.outputs.tasks }}
      count: ${{ steps.next.outputs.count }}
      base: ${{ steps.base.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - id: base # every new build starts from this exact commit, and Publish checks it does
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - id: next
        env:
          GH_TOKEN: ${{ github.token }}
          FEATURES: ${{ vars.FEATURES }}
          FEATURE_MAX_ATTEMPTS: ${{ vars.FEATURE_MAX_ATTEMPTS || '15' }}
          FEATURE_PARALLEL: ${{ vars.FEATURE_PARALLEL || '3' }}
        run: node scripts/features.ts next

  # No agents here. Reads what the task needs from GitHub (PR, failing logs, the other builds for the brief) with a
  # read-only token, running only main's scripts (loop/), and packs the prepared workspace for the build job.
  prepare:
    needs: pick
    if: needs.pick.outputs.count != '0' && needs.pick.outputs.count != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      issues: read
      checks: read
      statuses: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJSON(needs.pick.outputs.tasks) }}
    env:
      KIND: ${{ matrix.task.kind }}
      MODE: ${{ matrix.task.kind == 'build' && 'build' || 'fix' }} # team.ts and autopilot.ts: a conflict is a fix
      FILE: ${{ matrix.task.file }}
      NUMBER: ${{ matrix.task.kind == 'build' && matrix.task.id || matrix.task.number }}
      TASK: ${{ toJSON(matrix.task) }}
      TASKS: ${{ needs.pick.outputs.tasks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.pick.outputs.base }}
          path: loop # the scripts this job runs: main's, never the task branch's
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.pick.outputs.base }}
          path: work
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Prepare branch and task
        id: prep
        working-directory: work
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "stock-social-autopilot"
          git config user.email "autopilot@users.noreply.github.com"
          if [ "$KIND" = "fix" ]; then node "$GITHUB_WORKSPACE/loop/scripts/autopilot.ts" prepare; else node "$GITHUB_WORKSPACE/loop/scripts/features.ts" prepare; fi
          node "$GITHUB_WORKSPACE/loop/scripts/features.ts" brief
      - name: Pack the prepared workspace
        working-directory: work
        env:
          BRANCH: ${{ steps.prep.outputs.branch }}
          BASE_SHA: ${{ steps.prep.outputs.base_sha }}
          BASE_REF: ${{ steps.prep.outputs.base || 'main' }}
        run: |
          node "$GITHUB_WORKSPACE/loop/scripts/handoff.ts" prep
          tar -czf "$RUNNER_TEMP/workspace.tgz" .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prep-${{ matrix.task.key }}
          path: ${{ runner.temp }}/workspace.tgz
          if-no-files-found: error
          retention-days: 1

  # The agents. Every tool and root on this throwaway runner, so it holds no write token at all: `contents: read` and no
  # GitHub token in any step. It ends by handing back a bundle of its branch and .autopilot/ results as an artifact.
  build:
    needs: [pick, prepare]
    if: ${{ !cancelled() && needs.pick.outputs.count != '0' && needs.pick.outputs.count != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350 # GitHub's job limit is 360; a later attempt's larger budget needs the room
    permissions:
      contents: read
    strategy:
      fail-fast: false # one leg failing never stops the others
      matrix:
        task: ${{ fromJSON(needs.pick.outputs.tasks) }}
    services:
      postgres: # the team runs the same build and e2e checks as CI
        image: postgres:17
        env:
          POSTGRES_USER: stock_social
          POSTGRES_PASSWORD: stock_social
          POSTGRES_DB: stock_social
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://stock_social:stock_social@localhost:5432/stock_social
      APP_SECRET_KEY: ci-only
      CRON_SECRET: ci-only
      KIND: ${{ matrix.task.kind }}
      MODE: ${{ matrix.task.kind == 'build' && 'build' || 'fix' }}
      FILE: ${{ matrix.task.file }}
      NUMBER: ${{ matrix.task.kind == 'build' && matrix.task.id || matrix.task.number }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: prep-${{ matrix.task.key }}
          path: ${{ runner.temp }}/prep
      - name: Restore the prepared workspace
        id: prep
        run: |
          tar -xzf "$RUNNER_TEMP/prep/workspace.tgz" -C "$GITHUB_WORKSPACE"
          node -e 'const p = require("./.autopilot/prep.json"); console.log("branch=" + p.branch + "\nbase_sha=" + p.base + "\nbase=" + p.baseRef)' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Claude Code and a test browser
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          npx playwright install --with-deps chromium
      - name: Build to the owner's spec (committee plan, engineer ⇄ tester, committee verdict)
        id: team
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: ${{ vars.CLAUDE_CODE_SUBPROCESS_ENV_SCRUB || '1' }}
          SPEC_FILE: ${{ matrix.task.file }}
          BRANCH: ${{ steps.prep.outputs.branch }}
          BASE_REF: main
          QA_ROUNDS: ${{ vars.QA_ROUNDS || '40' }}
          TEAM_BUDGET_USD: ${{ vars.TEAM_BUDGET_USD || '150' }} # attempt 1; later attempts get more (team.ts budgetScale, up to 4×)
          ATTEMPT: ${{ matrix.task.attempt }}
          ESCALATE_AFTER: ${{ vars.ESCALATE_AFTER || '3' }}
          MODEL_ESCALATE: ${{ vars.MODEL_ESCALATE }}
          MODEL_ENGINEER: ${{ vars.MODEL_ENGINEER }}
          COMMITTEE: ${{ vars.FEATURE_COMMITTEE || 'on' }} # docs/IMPLEMENTATION.md "The cycle"; off = engineer ⇄ tester only
          COMMITTEE_ROUNDS: ${{ vars.COMMITTEE_ROUNDS || '5' }}
          MODEL_LEAD: ${{ vars.MODEL_LEAD }}
          MODEL_UX: ${{ vars.MODEL_UX }}
        run: node scripts/team.ts
      - name: Hand off to Publish
        if: steps.team.outcome == 'success'
        env:
          BASE_SHA: ${{ steps.prep.outputs.base_sha }}
        run: |
          # Commit what is left, an unfinished merge included (Publish refuses committed conflict markers), then bundle
          # only the commits since the base. No commits: no bundle, Publish reports it.
          mkdir -p "$RUNNER_TEMP/handoff"
          if [ -n "$(git status --porcelain)" ] || git rev-parse -q --verify MERGE_HEAD >/dev/null; then git add -A && git commit -q --no-verify -m "Work left uncommitted at the end of the run"; fi
          if [ "$(git rev-list --count "$BASE_SHA..HEAD")" != "0" ]; then git bundle create "$RUNNER_TEMP/handoff/branch.bundle" HEAD "^$BASE_SHA"; fi
          for f in result.json handoff.md plan.json; do if [ -f ".autopilot/$f" ]; then cp ".autopilot/$f" "$RUNNER_TEMP/handoff/"; fi; done
      - if: steps.team.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-${{ matrix.task.key }}
          path: ${{ runner.temp }}/handoff/
          if-no-files-found: error
          retention-days: 1

  # A fresh runner. It runs only main's copy of the loop (loop/), never anything from the agents' job, and pushes only
  # what scripts/handoff.ts verified: built on the trusted base, no protected path, sizes capped, text defanged.
  publish:
    needs: [pick, build]
    if: ${{ !cancelled() && needs.pick.outputs.count != '0' && needs.pick.outputs.count != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      checks: read
      statuses: read
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJSON(needs.pick.outputs.tasks) }}
    env:
      KIND: ${{ matrix.task.kind }}
      MODE: ${{ matrix.task.kind == 'build' && 'build' || 'fix' }}
      FILE: ${{ matrix.task.file }}
      NUMBER: ${{ matrix.task.kind == 'build' && matrix.task.id || matrix.task.number }}
      GH_REPO: ${{ github.repository }}
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: loop
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Download the agents' hand-off
        id: download
        continue-on-error: true # none: the agents' leg failed, so there is nothing to publish
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-${{ matrix.task.key }}
          path: ${{ runner.temp }}/handoff
      - name: Verify the hand-off
        id: verify
        if: steps.download.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_DIR: ${{ runner.temp }}/handoff
          GIT_CONFIG_GLOBAL: /dev/null # never the runner image's git config (lfs filters, credential helpers)
          GIT_CONFIG_NOSYSTEM: '1'
          BRANCH: ${{ matrix.task.kind == 'build' && matrix.task.branch || '' }}
          BASE_SHA: ${{ matrix.task.kind == 'build' && needs.pick.outputs.base || '' }}
          PR_NUMBER: ${{ matrix.task.kind != 'build' && matrix.task.number || '' }}
        run: |
          git init -q "$GITHUB_WORKSPACE/work" && cd "$GITHUB_WORKSPACE/work"
          git config user.name "stock-social-autopilot"
          git config user.email "autopilot@users.noreply.github.com"
          node "$GITHUB_WORKSPACE/loop/scripts/handoff.ts" verify
      - name: Publish
        if: steps.verify.outcome == 'success'
        working-directory: work
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.verify.outputs.branch }}
          GIT_CONFIG_GLOBAL: /dev/null # defense in depth: this repository was made here, from verified objects only
          GIT_CONFIG_NOSYSTEM: '1'
        run: |
          # Keep only the keys this job set (user, origin): nothing else can redirect or run during the push below.
          git config --local --unset-all core.hooksPath || true
          git config --local --name-only --list | sort -u | { grep -viE '^(core\.(repositoryformatversion|filemode|bare|logallrefupdates)|user\.(name|email)|remote\.origin\.(url|fetch)|branch\..+\.(remote|merge))$' || true; } | while read -r k; do git config --local --unset-all "$k"; done
          git config --local remote.origin.url "https://github.com/$GITHUB_REPOSITORY"
          rm -rf .git/hooks .git/config.worktree
          if [ "$KIND" = "build" ]; then node "$GITHUB_WORKSPACE/loop/scripts/features.ts" publish; exit; fi
          node "$GITHUB_WORKSPACE/loop/scripts/features.ts" resolved
          node "$GITHUB_WORKSPACE/loop/scripts/autopilot.ts" publish
          node "$GITHUB_WORKSPACE/loop/scripts/features.ts" notes
