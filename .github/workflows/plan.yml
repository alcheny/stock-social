name: Plan

# Dispatched by Build when nothing is open and no issue is ready. Creating issues kicks Build again.
on:
  workflow_dispatch:
    inputs:
      kickoff:
        description: Lines mode, once; plan three different starting steps, one per line
        required: false
        default: ''

concurrency:
  group: autopilot-plan

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: write

jobs:
  plan:
    if: vars.AUTOPILOT == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KICKOFF: ${{ inputs.kickoff }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Gather state
        id: pre
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_READY: ${{ vars.MAX_READY || '3' }}
        run: node scripts/autopilot.ts plan-pre
      - name: Install Claude Code
        if: steps.pre.outputs.need != '0'
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Business lead ⇄ engineer planning
        id: claude
        if: steps.pre.outputs.need != '0'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Scrub Anthropic/GitHub/cloud secrets from subprocesses the planning agents spawn. Repo variable to 0 to debug.
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: ${{ vars.CLAUDE_CODE_SUBPROCESS_ENV_SCRUB || '1' }}
          NEED: ${{ steps.pre.outputs.need }}
          PLAN_ROUNDS: ${{ vars.PLAN_ROUNDS || '4' }}
          PLAN_BUDGET_USD: ${{ vars.PLAN_BUDGET_USD || '6' }}
          MODEL_ENGINEER: ${{ vars.MODEL_ENGINEER }}
        run: node scripts/plan.ts
      - name: Create issues and post digest
        if: always() && steps.pre.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          NEED: ${{ steps.pre.outputs.need }}
        run: node scripts/autopilot.ts plan-post
