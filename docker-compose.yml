services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: stock_social
      POSTGRES_PASSWORD: stock_social
      POSTGRES_DB: stock_social
    ports: ["127.0.0.1:5432:5432"] # this machine only: the password above is fixed and public
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata:
