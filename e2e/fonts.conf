<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Pins the e2e browser to DejaVu Sans for system-ui and sans-serif, so every machine (session containers, CI) renders
     text at the same width and a layout that fits locally also fits in CI. Without it a session container picked a
     narrower font (Inter) than the CI runner, and fit tests passed locally but failed in CI by ~13%.
     Loaded by playwright.config.ts through FONTCONFIG_FILE; the system configuration is included first. -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <match target="pattern">
    <test qual="any" name="family"><string>system-ui</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>DejaVu Sans</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>DejaVu Sans</string></edit>
  </match>
</fontconfig>
